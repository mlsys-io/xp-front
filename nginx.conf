# xp-ui nginx — terminates TLS for xp.io, proxies /api/* to
# xpcloud backend, serves the React SPA for everything else.

server {
    listen 80;
    server_name xp.io;

    # ACME challenges bubble through edge-proxy :80.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name xp.io;

    ssl_certificate     /etc/letsencrypt/live/xp.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xp.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets; index.html revalidates so deploys
    # land without cache-busting.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        etag off;
        if_modified_since off;
    }

    # xpcloud backend — FastAPI on host port 8900. host.docker.internal
    # resolves via extra_hosts in docker-compose (host-gateway).
    # 20MB limit covers large app bundles (mbb-ai ~1.2MB; headroom for growth).
    client_max_body_size 20m;

    location /api/v1/ {
        proxy_pass http://host.docker.internal:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Git Smart HTTP — rewrites /{owner}/{name}.git/* to /git/{owner}/{name}/*
    # Supports git clone/push/pull against xp.io repos using a Lumid PAT as password.
    location ~ ^/([^/]+)/([^/]+)\.git(/.*)?$ {
        rewrite ^/([^/]+)/([^/]+)\.git(/.*)?$ /git/$1/$2$3 break;
        proxy_pass http://host.docker.internal:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        client_max_body_size 200m;
    }

    # Phase S2 — composer absorbed into Lumid Studio. xp.io/go now
    # 302s to lum.id/studio/skills so the cross-domain hop disappears:
    # the studio shell hosts the composer same-origin, sharing the
    # lm_session cookie without any CORS handshake.
    #
    # The lumid-ui-go container still runs (other surfaces may reuse
    # the /go basename), but it's no longer reachable through xp.io.
    # xp.io's anonymous marketspace at xp.io/ stays untouched — deep
    # links there continue to land on Repo / Marketspace pages.
    location = /go        { return 302 https://lum.id/studio/skills; }
    location = /go/       { return 302 https://lum.id/studio/skills; }
    location /go/         { return 302 https://lum.id/studio/skills; }

    # React Router — client-side routes hit 200, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve build-time precompressed brotli (.br) → gzip (.gz, -9) → on-the-fly,
    # all zero per-request CPU. brotli_static needs the ngx_brotli module from
    # the fholzer/nginx-brotli base image.
    brotli_static on;
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm font/woff2;
    gzip_min_length 1024;
}
