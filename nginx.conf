# xp-ui nginx — terminates TLS for xp.io, proxies /api/* to
# xpcloud backend, serves the React SPA for everything else.

server {
    listen 80;
    server_name xp.io;

    # ACME challenges bubble through edge-proxy :80.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name xp.io;

    ssl_certificate     /etc/letsencrypt/live/xp.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xp.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # No static root anymore — the SPA is retired; this server only proxies
    # /api/v1 + Git and 302s everything else to lum.id (see bottom).

    # xpcloud backend — FastAPI on host port 8900. host.docker.internal
    # resolves via extra_hosts in docker-compose (host-gateway).
    # 20MB limit covers large app bundles (mbb-ai ~1.2MB; headroom for growth).
    client_max_body_size 20m;

    # ^~ ensures /api/v1 is NEVER captured by the redirect regex below.
    location ^~ /api/v1/ {
        proxy_pass http://host.docker.internal:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Git Smart HTTP — rewrites /{owner}/{name}.git/* to /git/{owner}/{name}/*
    # Supports git clone/push/pull against xp.io repos using a Lumid PAT as password.
    location ~ ^/([^/]+)/([^/]+)\.git(/.*)?$ {
        rewrite ^/([^/]+)/([^/]+)\.git(/.*)?$ /git/$1/$2$3 break;
        proxy_pass http://host.docker.internal:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        client_max_body_size 200m;
    }

    # Phase S2 — composer absorbed into Lumid Studio. xp.io/go now
    # 302s to lum.id/studio/skills so the cross-domain hop disappears:
    # the studio shell hosts the composer same-origin, sharing the
    # lm_session cookie without any CORS handshake.
    #
    # The lumid-ui-go container still runs (other surfaces may reuse
    # the /go basename), but it's no longer reachable through xp.io.
    # xp.io's anonymous marketspace at xp.io/ stays untouched — deep
    # links there continue to land on Repo / Marketspace pages.
    location = /go        { return 302 https://lum.id/studio/skills; }
    location = /go/       { return 302 https://lum.id/studio/skills; }
    location /go/         { return 302 https://lum.id/studio/skills; }

    # SPA RETIRED (2026-06-17). xp.io is now the Git remote + read-only API
    # endpoint ONLY; the marketplace UI lives on lum.id (/explore public,
    # /studio authed). Everything that isn't /api/v1 or a *.git path redirects
    # to lum.id. Old repo deep links xp.io/<owner>/<name> → the Studio repo page;
    # the .git regex (above, defined earlier so it wins) still serves git clients.
    location = / { return 302 https://lum.id/explore; }
    location ~ ^/(?!api/|git/)([^/]+)/([^/]+)/?$ { return 302 https://lum.id/explore/r/$1/$2; }
    location / { return 302 https://lum.id/explore; }
}
