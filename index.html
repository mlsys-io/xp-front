<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xp.io — The open AutoResearch marketplace</title>
    <meta name="description" content="Browse, install, and fork AI apps, skills, datasets, and agent memory snapshots. Everything is a git repo. Install in one CLI line." />
    <meta name="theme-color" content="#0a1028" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load Google Fonts ASYNC so they never block first paint (cold first
         load was slow waiting on the round-trip to fonts.googleapis.com +
         gstatic). index.css has an Inter/system fallback, so text renders
         immediately and the webfont swaps in when ready. -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
          onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" />
    </noscript>
    <script defer src="https://lum.id/analytics/script.js" data-website-id="f05b8200-3b46-41ef-9d28-8529b9d47363"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
